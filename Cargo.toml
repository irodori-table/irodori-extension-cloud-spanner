[package]
name = "irodori-extension-cloud-spanner"
version = "0.1.5"
publish = false
edition = "2021"
license = "0BSD"
description = "Native Irodori Table connector extension for Cloud Spanner."
repository = "https://github.com/irodori-table/irodori-extension-cloud-spanner"
readme = "README.md"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE-*",
  "connector.config.json",
  "connector.source.json",
  "irodori.extension.json",
  "src/**",
  "native/source/**",
]

[lib]
name = "irodori_extension_cloud_spanner"
crate-type = ["cdylib", "rlib"]

[dependencies]
irodori-connector-abi = { git = "https://github.com/hjosugi/irodori-kit", tag = "v0.7.2" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pem = "3"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
